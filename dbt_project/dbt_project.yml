name: "atlas_data_platform"
version: "1.0.0"
config-version: 2

profile: "gdi_postgres"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  start_year: 2000
  end_year: 2023

models:
  atlas_data_platform:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts